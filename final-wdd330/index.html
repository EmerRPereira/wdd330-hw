<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Visual Vocabulary Builder - Learn English vocabulary with images, audio pronunciation, and interactive flashcards. Build your vocabulary through visual learning.">
    <meta name="keywords" content="vocabulary, learn english, flashcards, visual learning, ESL, education">
    <meta name="author" content="Visual Vocabulary Builder">
    <meta name="robots" content="index, follow">
    
    <title>Visual Vocabulary Builder - Learn English with Images & Audio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================================
           RESET AND BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CSS Custom Properties (Variables) */
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --accent: #F5A623;
            --success: #27AE60;
            --error: #E74C3C;
            --bg-light: #FFFFFF;
            --text-light: #2C3E50;
            --card-light: #F8F9FA;
            --border-light: #E0E0E0;
            --bg-dark: #1A1A2E;
            --text-dark: #ECF0F1;
            --card-dark: #2D2D44;
            --border-dark: #444;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
            --transition-default: all 0.3s ease;
            --border-radius-card: 24px;
            --border-radius-button: 50px;
        }

        /* Base Body Styles */
        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: var(--transition-default);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Dark Mode Theme */
        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        body.dark-mode .flashcard,
        body.dark-mode .library-card,
        body.dark-mode .stats-card {
            background: var(--card-dark);
        }

        body.dark-mode .search-input {
            background: var(--card-dark);
            color: var(--text-dark);
            border-color: var(--border-dark);
        }

        body.dark-mode .bottom-nav {
            background: var(--card-dark);
            border-top-color: var(--border-dark);
        }

        body.dark-mode .nav-item {
            color: var(--text-dark);
        }

        body.dark-mode .history-item {
            background: var(--card-dark);
            border-color: var(--border-dark);
        }

        body.dark-mode footer {
            background: var(--card-dark);
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }

        /* ============================================
           HEADER COMPONENT
           ============================================ */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.5rem;
            color: white;
        }

        .logo p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .language-select {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .language-select option {
            color: var(--text-light);
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: var(--transition-default);
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        /* ============================================
           SEARCH SECTION
           ============================================ */
        .search-section {
            margin-bottom: 2rem;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-input {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: 2px solid var(--border-light);
            border-radius: var(--border-radius-button);
            font-family: 'Open Sans', sans-serif;
            transition: var(--transition-default);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 2rem;
            border-radius: var(--border-radius-button);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-default);
            font-size: 1rem;
        }

        .btn-search:hover {
            background: #357ABD;
            transform: translateY(-2px);
        }

        /* Search History */
        .search-history {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .history-item {
            background: var(--card-light);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition-default);
            border: 1px solid var(--border-light);
        }

        .history-item:hover {
            background: var(--primary);
            color: white;
        }

        /* ============================================
           FLASHCARD COMPONENT
           ============================================ */
        .flashcard {
            background: var(--card-light);
            border-radius: var(--border-radius-card);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
            transition: var(--transition-default);
            display: none;
        }

        .flashcard.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flashcard-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .flashcard-content {
            padding: 2rem;
        }

        .word-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .word {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .phonetic {
            font-family: 'Roboto Mono', monospace;
            color: var(--accent);
            font-size: 1rem;
        }

        /* Pronunciation Button */
        .pronounce-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition-default);
            margin: 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .pronounce-btn:hover {
            transform: scale(1.1);
        }

        /* Definition Section */
        .definition-section {
            text-align: center;
            margin: 1.5rem 0;
        }

        .definition-text {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Example Section */
        .example-section {
            background: rgba(74, 144, 226, 0.1);
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            font-style: italic;
            margin: 1.5rem 0;
            border-left: 4px solid var(--primary);
        }

        /* Image Options Gallery */
        .image-options {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .image-option {
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition-default);
            border: 3px solid transparent;
            width: 100px;
            height: 100px;
        }

        .image-option:hover {
            transform: scale(1.05);
        }

        .image-option.selected {
            border-color: var(--primary);
        }

        .image-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Flashcard Action Buttons */
        .flashcard-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        /* ============================================
           BUTTON COMPONENTS
           ============================================ */
        .btn {
            padding: 0.85rem 2rem;
            border: none;
            border-radius: var(--border-radius-button);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-default);
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #357ABD;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #3bc2a4;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--error);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        /* ============================================
           LIBRARY SECTION
           ============================================ */
        .library-section {
            margin-top: 2rem;
            display: none;
        }

        .library-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .library-card {
            background: var(--card-light);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition-default);
            cursor: pointer;
            border: 1px solid var(--border-light);
        }

        .library-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .library-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .library-card-content {
            padding: 1rem;
        }

        .library-word {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .library-definition {
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .library-actions {
            display: flex;
            gap: 0.5rem;
        }

        .library-actions button {
            background: var(--primary);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
        }

        /* ============================================
           PROFILE SECTION
           ============================================ */
        .profile-section {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .profile-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .stats-card {
            background: var(--card-light);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1rem;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* ============================================
           BOTTOM NAVIGATION
           ============================================ */
        .bottom-nav {
            background: var(--card-light);
            border-top: 1px solid var(--border-light);
            padding: 0.75rem 1rem;
            position: sticky;
            bottom: 0;
            margin-top: auto;
        }

        .nav-menu {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 12px;
            transition: var(--transition-default);
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .nav-item i {
            font-size: 1.5rem;
        }

        .nav-item.active {
            color: var(--primary);
        }

        /* ============================================
           REVIEW MODAL
           ============================================ */
        .review-mode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .review-card {
            background: white;
            max-width: 500px;
            width: 90%;
            border-radius: var(--border-radius-card);
            padding: 2rem;
            text-align: center;
        }

        body.dark-mode .review-card {
            background: var(--card-dark);
        }

        .review-word {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .review-definition {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .review-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* ============================================
           LOADING COMPONENT
           ============================================ */
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ============================================
           TOAST NOTIFICATION
           ============================================ */
        .toast {
            position: fixed;
            bottom: 80px;
            right: 20px;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius-button);
            animation: slideIn 0.3s ease;
            z-index: 1000;
            font-size: 0.9rem;
            color: white;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        .toast.warning { background: var(--accent); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================
           FOOTER
           ============================================ */
        footer {
            text-align: center;
            padding: 1.5rem;
            background: var(--card-light);
            font-size: 0.85rem;
        }

        /* ============================================
           RESPONSIVE DESIGN (Mobile First)
           ============================================ */
        
        /* Tablet Styles (768px and up) */
        @media (min-width: 768px) {
            .word { font-size: 2.2rem; }
            .flashcard-image { height: 320px; }
        }

        /* Desktop Styles (1024px and up) */
        @media (min-width: 1024px) {
            .flashcard {
                display: flex;
                flex-direction: row;
                align-items: stretch;
            }
            .flashcard-image {
                width: 40%;
                height: auto;
                min-height: 400px;
            }
            .flashcard-content {
                width: 60%;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        /* Mobile Styles (max-width: 768px) */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; text-align: center; }
            .word { font-size: 1.8rem; }
            .flashcard-content { padding: 1.5rem; }
            .flashcard-image { height: 220px; }
            .btn { padding: 0.7rem 1.5rem; font-size: 0.9rem; }
            .image-option { width: 80px; height: 80px; }
            .library-grid { grid-template-columns: 1fr; }
            .section-title { flex-direction: column; text-align: center; }
        }

        /* Small Mobile (max-width: 480px) */
        @media (max-width: 480px) {
            .search-box { flex-direction: column; }
            .btn-search { padding: 0.75rem; }
            .word { font-size: 1.5rem; }
            .flashcard-actions { flex-direction: column; }
            .review-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1>📚 VOCAB BUILDER</h1>
                <p>Visual learning for new languages</p>
            </div>
            <div class="nav-buttons">
                <select id="languageSelect" class="language-select" aria-label="Select language">
                    <option value="pt">🇧🇷 Português</option>
                    <option value="en" selected>🇺🇸 English</option>
                </select>
                <button id="themeToggle" class="btn-icon" aria-label="Toggle dark/light mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Enter a word..." aria-label="Word to search">
                <button id="searchBtn" class="btn-search" aria-label="Search word">Search</button>
            </div>
            <div id="searchHistory" class="search-history" aria-label="Search history"></div>
        </div>

        <div id="flashcard" class="flashcard" aria-label="Word flashcard"></div>

        <div id="librarySection" class="library-section" aria-label="Saved words library">
            <div class="section-title">
                <h2><i class="fas fa-book"></i> My Library</h2>
                <button id="clearLibraryBtn" class="btn-danger" aria-label="Clear all saved words">Clear All</button>
            </div>
            <div id="libraryGrid" class="library-grid"></div>
        </div>

        <div id="profileSection" class="profile-section" aria-label="User profile statistics">
            <h2><i class="fas fa-user"></i> My Profile</h2>
            <div class="stats-card">
                <div class="stat-number" id="totalWordsLearned">0</div>
                <p>Words Learned</p>
                <hr style="margin: 1rem 0;">
                <div class="stat-number" id="reviewCount">0</div>
                <p>Total Reviews</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-menu">
            <button class="nav-item active" data-section="home" aria-label="Go to home"><i class="fas fa-home"></i><span>Home</span></button>
            <button class="nav-item" data-section="library" aria-label="Go to library"><i class="fas fa-book"></i><span>Library</span></button>
            <button class="nav-item" data-section="review" aria-label="Start review mode"><i class="fas fa-random"></i><span>Review</span></button>
            <button class="nav-item" data-section="profile" aria-label="View profile"><i class="fas fa-user"></i><span>Profile</span></button>
        </div>
    </div>

    <footer>
        <p>© 2025 Visual Vocabulary Builder • Visual learning for new languages</p>
    </footer>

    <div id="reviewModal" class="review-mode" aria-label="Review mode">
        <div class="review-card">
            <h2 class="review-word" id="reviewWord"></h2>
            <p class="review-definition" id="reviewDefinition"></p>
            <div class="review-buttons">
                <button id="reviewWrong" class="btn btn-danger" aria-label="Mark as wrong">❌ Wrong</button>
                <button id="reviewCorrect" class="btn btn-primary" aria-label="Mark as correct">✅ Correct</button>
                <button id="reviewClose" class="btn btn-secondary" aria-label="Close review">Close</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================
         * VISUAL VOCABULARY BUILDER
         * A web application for learning English vocabulary
         * with images, audio pronunciation, and flashcards
         * 
         * @version 1.0.0
         * @author Visual Vocabulary Builder
         * @license MIT
         * ============================================
         */
        
        // ============================================
        // GLOBAL STATE VARIABLES
        // ============================================
        let library = [];           // Array of saved flashcards
        let searchHistory = [];     // Array of searched words (max 5)
        let currentLanguage = 'en'; // Current UI language ('en' or 'pt')
        let currentWordData = null; // Currently displayed word data
        let currentImages = [];      // Array of image URLs for current word
        let selectedImageUrl = '';   // Currently selected image URL
        
        // ============================================
        // CONSTANTS & CONFIGURATION
        // ============================================
        const DICTIONARY_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
        const PLACEHOLDER_IMAGE = 'https://placehold.co/600x400/4A90E2/white?text=No+Image+Available';
        
        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        
        /**
         * Displays a toast notification message
         * @param {string} message - The message to display
         * @param {string} type - The type of toast ('success', 'error', 'warning')
         */
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = message;
            toast.setAttribute('role', 'alert');
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        /**
         * Shows loading state in a container
         * @param {HTMLElement} container - Container to show loading in
         */
        function showLoading(container) {
            if (container) {
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin spinner"></i> Loading...</div>';
                container.classList.add('active');
            }
        }
        
        /**
         * Escapes HTML special characters to prevent XSS attacks
         * @param {string} text - Text to escape
         * @returns {string} Escaped HTML text
         */
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        /**
         * Generates a fallback example sentence when API doesn't provide one
         * @param {string} word - The vocabulary word
         * @param {string} definition - The word definition
         * @returns {string} Generated example sentence
         */
        function generateExampleSentence(word, definition) {
            const templates = [
                `"${word}" is an important word to learn in English.`,
                `I learned the meaning of "${word}" today.`,
                `Can you use "${word}" in a sentence?`,
                `The word "${word}" means: ${definition.substring(0, 50)}...`,
                `Understanding "${word}" helps improve vocabulary.`
            ];
            return templates[Math.floor(Math.random() * templates.length)];
        }
        
        // ============================================
        // API FUNCTIONS (External APIs)
        // ============================================
        
        /**
         * Fetches word definition from Free Dictionary API
         * @param {string} word - Word to look up
         * @returns {Promise<Object|null>} Word data or null if not found
         */
        async function fetchDefinition(word) {
            try {
                const response = await fetch(`${DICTIONARY_API}${word}`);
                if (!response.ok) throw new Error('Word not found');
                const data = await response.json();
                
                const meaning = data[0].meanings[0];
                let definition = meaning.definitions[0].definition;
                let example = meaning.definitions[0].example || null;
                const phonetic = data[0].phonetic || '';
                const partOfSpeech = meaning.partOfSpeech;
                
                // Generate example if API doesn't provide one
                if (!example) {
                    example = generateExampleSentence(word, definition);
                }
                
                return {
                    word: data[0].word,
                    definition: `${partOfSpeech}: ${definition}`,
                    phonetic: phonetic,
                    example: example,
                    partOfSpeech: partOfSpeech
                };
            } catch (error) {
                console.error('Dictionary API error:', error);
                return null;
            }
        }
        
        /**
         * Fetches images for a word from multiple sources
         * @param {string} word - Word to search images for
         * @returns {Promise<string[]>} Array of image URLs
         */
        async function fetchImages(word) {
            const imageUrls = [];
            
            // Method 1: Unsplash (may fail due to CORS)
            try {
                const unsplashUrl = `https://source.unsplash.com/400x300/?${encodeURIComponent(word)}`;
                imageUrls.push(unsplashUrl);
            } catch (e) {
                console.log('Unsplash error:', e);
            }
            
            // Method 2: Placeholder with the word (always works)
            imageUrls.push(`https://placehold.co/600x400/4A90E2/white?text=${encodeURIComponent(word)}`);
            
            // Method 3: Category-based placeholders (fallback)
            const categories = ['nature', 'animal', 'food', 'color'];
            for (let cat of categories) {
                imageUrls.push(`https://placehold.co/600x400/50E3C2/white?text=${cat}+${encodeURIComponent(word)}`);
            }
            
            return imageUrls.slice(0, 5); // Return up to 5 options
        }
        
        // ============================================
        // SPEECH SYNTHESIS (Web Speech API)
        // ============================================
        
        /**
         * Speaks a word using the browser's Web Speech API
         * @param {string} word - Word to pronounce
         */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                
                setTimeout(() => {
                    speechSynthesis.speak(utterance);
                }, 100);
            } else {
                showToast('Speech not supported in this browser', 'error');
            }
        }
        
        // ============================================
        // LOCAL STORAGE FUNCTIONS
        // ============================================
        
        function saveLibrary() {
            localStorage.setItem('vocab_library', JSON.stringify(library));
        }
        
        function loadLibrary() {
            const saved = localStorage.getItem('vocab_library');
            library = saved ? JSON.parse(saved) : [];
            updateProfileStats();
            renderLibrary();
        }
        
        function saveSearchHistory() {
            localStorage.setItem('vocab_history', JSON.stringify(searchHistory));
        }
        
        function loadSearchHistory() {
            const saved = localStorage.getItem('vocab_history');
            searchHistory = saved ? JSON.parse(saved) : [];
            updateSearchHistoryUI();
        }
        
        function saveTheme(theme) {
            localStorage.setItem('vocab_theme', theme);
        }
        
        function loadTheme() {
            return localStorage.getItem('vocab_theme') || 'light';
        }
        
        function saveLanguage(lang) {
            localStorage.setItem('vocab_language', lang);
        }
        
        function loadLanguage() {
            return localStorage.getItem('vocab_language') || 'en';
        }
        
        // ============================================
        // UI RENDER FUNCTIONS
        // ============================================
        
        function updateSearchHistoryUI() {
            const historyDiv = document.getElementById('searchHistory');
            if (!historyDiv) return;
            
            if (searchHistory.length === 0) {
                historyDiv.innerHTML = '';
                return;
            }
            
            historyDiv.innerHTML = searchHistory.map(word => `
                <div class="history-item" onclick="window.searchHistoryWord('${word}')" role="button" tabindex="0">
                    ${escapeHtml(word)}
                </div>
            `).join('');
        }
        
        function addToSearchHistory(word) {
            searchHistory = searchHistory.filter(w => w !== word);
            searchHistory.unshift(word);
            if (searchHistory.length > 5) searchHistory.pop();
            saveSearchHistory();
            updateSearchHistoryUI();
        }
        
        /**
         * Renders the flashcard with word data and images
         * @param {Object} wordData - Word information
         * @param {string[]} images - Array of image URLs
         * @param {string} selectedImage - Currently selected image URL
         */
        function renderFlashcard(wordData, images, selectedImage) {
            currentWordData = wordData;
            currentImages = images || [];
            selectedImageUrl = selectedImage || (images && images[0]) || PLACEHOLDER_IMAGE;
            
            const displayImages = currentImages.length > 0 ? currentImages : [PLACEHOLDER_IMAGE];
            
            const flashcardHtml = `
                <img src="${selectedImageUrl}" alt="${wordData.word}" class="flashcard-image" onerror="this.src='${PLACEHOLDER_IMAGE}'">
                <div class="flashcard-content">
                    <div class="word-section">
                        <h2 class="word">${escapeHtml(wordData.word)}</h2>
                        <div class="phonetic">${wordData.phonetic || ''}</div>
                        <button id="speakBtn" class="pronounce-btn" aria-label="Pronounce ${wordData.word}">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                    <div class="definition-section">
                        <p class="definition-text">${escapeHtml(wordData.definition)}</p>
                    </div>
                    <div class="example-section">
                        <i class="fas fa-quote-left"></i> "${escapeHtml(wordData.example)}"
                    </div>
                    <div class="image-options">
                        ${displayImages.map((img, idx) => `
                            <div class="image-option ${selectedImageUrl === img ? 'selected' : ''}" onclick="window.selectImage(${idx})" role="button" tabindex="0">
                                <img src="${img}" alt="Image option ${idx + 1}" onerror="this.src='${PLACEHOLDER_IMAGE}'">
                            </div>
                        `).join('')}
                    </div>
                    <div class="flashcard-actions">
                        <button id="saveCardBtn" class="btn btn-primary" aria-label="Save word to library">
                            <i class="fas fa-save"></i> SAVE
                        </button>
                        <button id="newWordBtn" class="btn btn-secondary" aria-label="Clear and search new word">
                            <i class="fas fa-plus"></i> NEW
                        </button>
                    </div>
                </div>
            `;
            
            const flashcardContainer = document.getElementById('flashcard');
            flashcardContainer.innerHTML = flashcardHtml;
            flashcardContainer.classList.add('active');
            
            const speakBtn = document.getElementById('speakBtn');
            const saveBtn = document.getElementById('saveCardBtn');
            const newBtn = document.getElementById('newWordBtn');
            
            if (speakBtn) speakBtn.addEventListener('click', () => speakWord(wordData.word));
            if (saveBtn) saveBtn.addEventListener('click', saveToLibrary);
            if (newBtn) newBtn.addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('searchInput').focus();
                flashcardContainer.classList.remove('active');
            });
        }
        
        function renderLibrary() {
            const libraryGrid = document.getElementById('libraryGrid');
            if (!libraryGrid) return;
            
            if (library.length === 0) {
                libraryGrid.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">✨ No words saved yet. Search and save words to build your vocabulary! ✨</p>';
                return;
            }
            
            libraryGrid.innerHTML = library.map(card => `
                <div class="library-card" onclick="window.viewWord('${escapeHtml(card.word)}')" role="button" tabindex="0">
                    <img src="${card.imageUrl || PLACEHOLDER_IMAGE}" alt="${escapeHtml(card.word)}" onerror="this.src='${PLACEHOLDER_IMAGE}'">
                    <div class="library-card-content">
                        <div class="library-word">${escapeHtml(card.word)}</div>
                        <div class="library-definition">${escapeHtml(card.definition.substring(0, 80))}...</div>
                        <div class="library-actions">
                            <button onclick="event.stopPropagation(); window.removeFromLibrary('${card.id}')" aria-label="Remove ${card.word} from library">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                            <button onclick="event.stopPropagation(); window.speakWord('${escapeHtml(card.word)}')" aria-label="Pronounce ${card.word}">
                                <i class="fas fa-volume-up"></i> Listen
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updateProfileStats() {
            const totalWords = document.getElementById('totalWordsLearned');
            const reviewCount = document.getElementById('reviewCount');
            
            if (totalWords) totalWords.textContent = library.length;
            if (reviewCount) {
                const totalReviews = library.reduce((sum, card) => sum + (card.reviewCount || 0), 0);
                reviewCount.textContent = totalReviews;
            }
        }
        
        // ============================================
        // CORE APPLICATION FUNCTIONS
        // ============================================
        
        window.selectImage = function(index) {
            if (currentImages && currentImages[index]) {
                selectedImageUrl = currentImages[index];
                renderFlashcard(currentWordData, currentImages, selectedImageUrl);
            }
        };
        
        /**
         * Searches for a word using external APIs
         */
        async function searchWord() {
            const searchInput = document.getElementById('searchInput');
            const word = searchInput?.value.trim().toLowerCase();
            
            if (!word) {
                showToast('Please enter a word to search', 'error');
                return;
            }
            
            const flashcardContainer = document.getElementById('flashcard');
            showLoading(flashcardContainer);
            
            try {
                const definition = await fetchDefinition(word);
                if (!definition) {
                    showToast(MESSAGES[currentLanguage]?.wordNotFound || 'Word not found. Try another word!', 'error');
                    flashcardContainer.innerHTML = '';
                    flashcardContainer.classList.remove('active');
                    return;
                }
                
                const images = await fetchImages(word);
                const selectedImage = images.length > 0 ? images[0] : null;
                
                renderFlashcard(definition, images, selectedImage);
                addToSearchHistory(word);
                
            } catch (error) {
                console.error('Search error:', error);
                showToast('Error searching word. Please try again.', 'error');
                flashcardContainer.innerHTML = '';
                flashcardContainer.classList.remove('active');
            }
        }
        
        function saveToLibrary() {
            if (!currentWordData) {
                showToast('No word to save', 'error');
                return;
            }
            
            const exists = library.some(item => item.word === currentWordData.word);
            if (exists) {
                showToast(MESSAGES[currentLanguage]?.alreadyExists || 'This word is already in your library!', 'warning');
                return;
            }
            
            const flashcard = {
                id: `${currentWordData.word}_${Date.now()}`,
                word: currentWordData.word,
                definition: currentWordData.definition,
                phonetic: currentWordData.phonetic,
                example: currentWordData.example,
                imageUrl: selectedImageUrl,
                createdAt: new Date().toISOString(),
                reviewCount: 0,
                lastReviewed: null
            };
            
            library.unshift(flashcard);
            saveLibrary();
            renderLibrary();
            updateProfileStats();
            showToast(MESSAGES[currentLanguage]?.saveSuccess || 'Word saved to library!', 'success');
        }
        
        window.removeFromLibrary = function(id) {
            library = library.filter(card => card.id !== id);
            saveLibrary();
            renderLibrary();
            updateProfileStats();
            showToast(MESSAGES[currentLanguage]?.removeSuccess || 'Word removed from library', 'success');
        };
        
        window.viewWord = async function(word) {
            document.getElementById('searchInput').value = word;
            navigateTo('home');
            await searchWord();
        };
        
        window.searchHistoryWord = async function(word) {
            document.getElementById('searchInput').value = word;
            await searchWord();
        };
        
        function clearLibrary() {
            if (confirm('Are you sure you want to clear your entire library?')) {
                library = [];
                saveLibrary();
                renderLibrary();
                updateProfileStats();
                showToast(MESSAGES[currentLanguage]?.libraryCleared || 'Library cleared', 'success');
            }
        }
        
        // ============================================
        // REVIEW SYSTEM (Spaced Repetition)
        // ============================================
        
        let reviewQueue = [];
        let reviewIndex = 0;
        
        function startReview() {
            if (library.length === 0) {
                showToast(MESSAGES[currentLanguage]?.emptyLibrary || 'No words to review. Save some words first!', 'warning');
                return;
            }
            
            reviewQueue = [...library];
            reviewIndex = 0;
            showNextReview();
        }
        
        function showNextReview() {
            if (reviewIndex >= reviewQueue.length) {
                closeReviewModal();
                showToast(MESSAGES[currentLanguage]?.reviewComplete || 'Review completed! Great job! 🎉', 'success');
                updateProfileStats();
                return;
            }
            
            const card = reviewQueue[reviewIndex];
            document.getElementById('reviewWord').textContent = card.word;
            document.getElementById('reviewDefinition').textContent = card.definition;
            document.getElementById('reviewModal').style.display = 'flex';
        }
        
        function reviewAnswer(isCorrect) {
            const card = reviewQueue[reviewIndex];
            
            if (isCorrect) {
                card.reviewCount = (card.reviewCount || 0) + 1;
                card.lastReviewed = new Date().toISOString();
                const index = library.findIndex(item => item.id === card.id);
                if (index !== -1) library[index] = card;
                saveLibrary();
                showToast(MESSAGES[currentLanguage]?.correct || 'Correct! 🎯', 'success');
            } else {
                showToast(MESSAGES[currentLanguage]?.wrong || 'Keep practicing! 📚', 'warning');
                reviewQueue.push(card);
            }
            
            reviewIndex++;
            showNextReview();
        }
        
        function closeReviewModal() {
            document.getElementById('reviewModal').style.display = 'none';
            reviewQueue = [];
            reviewIndex = 0;
        }
        
        // ============================================
        // INTERNATIONALIZATION (i18n)
        // ============================================
        
        const MESSAGES = {
            en: {
                searchPlaceholder: 'Enter a word...',
                wordNotFound: 'Word not found. Try another word!',
                saveSuccess: 'Word saved to library!',
                alreadyExists: 'This word is already in your library!',
                removeSuccess: 'Word removed from library',
                libraryCleared: 'Library cleared',
                emptyLibrary: 'No words to review. Save some words first!',
                reviewComplete: 'Review completed! Great job! 🎉',
                correct: 'Correct! 🎯',
                wrong: 'Keep practicing! 📚'
            },
            pt: {
                searchPlaceholder: 'Digite uma palavra...',
                wordNotFound: 'Palavra não encontrada. Tente outra palavra!',
                saveSuccess: 'Palavra salva na biblioteca!',
                alreadyExists: 'Esta palavra já está na sua biblioteca!',
                removeSuccess: 'Palavra removida da biblioteca',
                libraryCleared: 'Biblioteca limpa',
                emptyLibrary: 'Nenhuma palavra para revisar. Salve algumas palavras primeiro!',
                reviewComplete: 'Revisão concluída! Ótimo trabalho! 🎉',
                correct: 'Correto! 🎯',
                wrong: 'Continue praticando! 📚'
            }
        };
        
        // ============================================
        // NAVIGATION
        // ============================================
        
        function navigateTo(section) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            const activeItem = document.querySelector(`.nav-item[data-section="${section}"]`);
            if (activeItem) activeItem.classList.add('active');
            
            const flashcard = document.getElementById('flashcard');
            const librarySection = document.getElementById('librarySection');
            const profileSection = document.getElementById('profileSection');
            
            if (flashcard) {
                if (section === 'home') {
                    flashcard.style.display = 'block';
                } else {
                    flashcard.style.display = 'none';
                }
            }
            if (librarySection) librarySection.classList.toggle('active', section === 'library');
            if (profileSection) profileSection.classList.toggle('active', section === 'profile');
            
            if (section === 'library') renderLibrary();
            if (section === 'profile') updateProfileStats();
            if (section === 'review') startReview();
        }
        
        // ============================================
        // THEME MANAGEMENT (Dark/Light Mode)
        // ============================================
        
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            saveTheme(theme);
            
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.classList.remove(theme === 'dark' ? 'fa-moon' : 'fa-sun');
                icon.classList.add(theme === 'dark' ? 'fa-sun' : 'fa-moon');
            }
        }
        
        function applyTheme() {
            const theme = loadTheme();
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                const icon = document.querySelector('#themeToggle i');
                if (icon) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                }
            }
        }
        
        // ============================================
        // LANGUAGE MANAGEMENT
        // ============================================
        
        function changeLanguage(e) {
            currentLanguage = e.target.value;
            saveLanguage(currentLanguage);
            applyLanguage();
        }
        
        function applyLanguage() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.placeholder = MESSAGES[currentLanguage]?.searchPlaceholder || 'Enter a word...';
            }
        }
        
        // ============================================
        // APPLICATION INITIALIZATION
        // ============================================
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Visual Vocabulary Builder initialized');
            
            // Load data from localStorage
            loadLibrary();
            loadSearchHistory();
            currentLanguage = loadLanguage();
            applyTheme();
            applyLanguage();
            
            // Set language selector value
            const langSelect = document.getElementById('languageSelect');
            if (langSelect) langSelect.value = currentLanguage;
            
            // Set up event listeners
            const searchBtn = document.getElementById('searchBtn');
            const searchInput = document.getElementById('searchInput');
            const themeToggle = document.getElementById('themeToggle');
            const languageSelect = document.getElementById('languageSelect');
            const clearLibraryBtn = document.getElementById('clearLibraryBtn');
            const reviewCorrect = document.getElementById('reviewCorrect');
            const reviewWrong = document.getElementById('reviewWrong');
            const reviewClose = document.getElementById('reviewClose');
            
            if (searchBtn) searchBtn.addEventListener('click', searchWord);
            if (searchInput) searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchWord();
            });
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
            if (languageSelect) languageSelect.addEventListener('change', changeLanguage);
            if (clearLibraryBtn) clearLibraryBtn.addEventListener('click', clearLibrary);
            if (reviewCorrect) reviewCorrect.addEventListener('click', () => reviewAnswer(true));
            if (reviewWrong) reviewWrong.addEventListener('click', () => reviewAnswer(false));
            if (reviewClose) reviewClose.addEventListener('click', closeReviewModal);
            
            // Navigation event listeners
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => navigateTo(item.dataset.section));
            });
            
            // Expose functions globally for inline handlers
            window.speakWord = speakWord;
            window.searchWord = searchWord;
            window.navigateTo = navigateTo;
            
            console.log('✅ Application ready! Search for a word to begin.');
        });
    </script>
</body>
</html>
