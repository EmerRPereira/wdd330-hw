<!DOCTYPE html>
<html>
<head>
    <title>Teste - Diagnóstico</title>
</head>
<body>
    <h1>Teste de JavaScript</h1>
    <button id="testBtn">Clique para testar</button>
    <div id="output"></div>

    <script type="module">
        console.log('✅ Módulo ES funcionando!');
        
        document.getElementById('testBtn').addEventListener('click', async () => {
            const output = document.getElementById('output');
            output.innerHTML = '🔄 Testando API de dicionário...';
            
            try {
                const response = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/hello');
                const data = await response.json();
                output.innerHTML = `✅ API funcionando! Definição: ${data[0].meanings[0].definitions[0].definition.substring(0, 100)}...`;
            } catch (error) {
                output.innerHTML = `❌ Erro: ${error.message}`;
            }
        });
    </script>
</body>
</html>
