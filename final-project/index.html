<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Visual Vocabulary Builder - Learn English with Images & Audio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1>📚 VOCAB BUILDER</h1>
                <p>Visual learning for new languages</p>
            </div>
            <div class="nav-buttons">
                <select id="languageSelect" class="language-select">
                    <option value="pt">🇧🇷 Português</option>
                    <option value="en" selected>🇺🇸 English</option>
                </select>
                <button id="themeToggle" class="btn-icon">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Enter a word...">
                <button id="searchBtn" class="btn-search">Search</button>
            </div>
            <div id="searchHistory" class="search-history"></div>
        </div>

        <!-- Flashcard Section -->
        <div id="flashcard" class="flashcard"></div>

        <!-- Library Section -->
        <div id="librarySection" class="library-section">
            <div class="section-title">
                <h2><i class="fas fa-book"></i> My Library</h2>
                <button id="clearLibraryBtn" class="btn-icon btn-danger">Clear All</button>
            </div>
            <div id="libraryGrid" class="library-grid"></div>
        </div>

        <!-- Profile Section -->
        <div id="profileSection" class="profile-section">
            <h2><i class="fas fa-user"></i> My Profile</h2>
            <div class="stats-card">
                <div class="stat-number" id="totalWordsLearned">0</div>
                <p>Words Learned</p>
                <hr style="margin: 1rem 0;">
                <div class="stat-number" id="reviewCount">0</div>
                <p>Total Reviews</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-menu">
            <button class="nav-item active" data-section="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" data-section="library">
                <i class="fas fa-book"></i>
                <span>Library</span>
            </button>
            <button class="nav-item" data-section="review">
                <i class="fas fa-random"></i>
                <span>Review</span>
            </button>
            <button class="nav-item" data-section="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </button>
        </div>
    </div>

    <footer>
        <p>© 2025 Visual Vocabulary Builder • Visual learning for new languages</p>
    </footer>

    <!-- Review Modal -->
    <div id="reviewModal" class="review-mode">
        <div class="review-card">
            <h2 class="review-word" id="reviewWord"></h2>
            <p class="review-definition" id="reviewDefinition"></p>
            <div class="review-buttons">
                <button id="reviewWrong" class="btn btn-danger">❌ Wrong</button>
                <button id="reviewCorrect" class="btn btn-primary">✅ Correct</button>
                <button id="reviewClose" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
